{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Sign in</h1>
  <p class="muted">Welcome back. Enter your credentials to continue.</p>
  <form method="post" novalidate>
    <label>
      <span>Username or email</span>
      <input name="username" autocomplete="username" required value="{{ form.username or '' }}">
    </label>
    <label>
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
  <p class="muted small">No account yet? <a href="{{ url_for('auth.register') }}">Create one</a>.</p>
</div>
{% endblock %}
