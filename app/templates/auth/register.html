{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create an account</h1>
  <p class="muted">You'll use this to sign in to the analytics console.</p>
  <form method="post" novalidate>
    <label>
      <span>Username</span>
      <input name="username" autocomplete="username" minlength="3" maxlength="64" required
             value="{{ form.username or '' }}" pattern="[A-Za-z0-9_.\-]{3,64}">
    </label>
    <label>
      <span>Email</span>
      <input type="email" name="email" autocomplete="email" required value="{{ form.email or '' }}">
    </label>
    <label>
      <span>Password</span>
      <input type="password" name="password" minlength="8" autocomplete="new-password" required>
    </label>
    <button class="btn btn-primary" type="submit">Register</button>
  </form>
  <p class="muted small">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>.</p>
</div>
{% endblock %}
